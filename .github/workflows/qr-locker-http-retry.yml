name: QR locker full test retry
on:
  pull_request:
    branches: [feature/qr-locker-v3]
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Main
            command: npm test
          - suite: Mobile
            command: npm --prefix mobile test
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all tests
        run: timeout 90s ${{ matrix.command }}
