name: QR locker full test retry
on:
  pull_request:
    branches: [feature/qr-locker-v3]
permissions:
  contents: read
jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Main suite
        run: timeout 120s npm test
      - name: Mobile suite
        if: always()
        run: timeout 90s npm --prefix mobile test
